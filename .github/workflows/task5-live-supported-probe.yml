name: Task 5 Live Supported Probe

on:
  push:
    branches:
      - task5-production-nano-payment
    paths:
      - .github/workflows/task5-live-supported-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Initialize real Pursekeeper capabilities read-only
        run: |
          node --input-type=module - <<'NODE'
          import { createProductionNanoPaymentBootstrap } from './src/payment/production-resource-server.ts';

          const payTo = 'nano_1zwik4hd1pjy73owfah8xuxzokk6zexc5a6rs6byhrxryggkbh38kemm51yt';
          const bootstrap = createProductionNanoPaymentBootstrap({
            facilitatorUrl: 'https://facilitator.pursekeeper.dev',
          });

          if (bootstrap.status() !== 'cold' || bootstrap.isReady()) {
            throw new Error('Bootstrap must start cold.');
          }

          const resourceServer = await bootstrap.initialize();
          if (!bootstrap.isReady() || bootstrap.status() !== 'ready') {
            throw new Error('Bootstrap did not become ready after supported synchronization.');
          }

          const requirements = await resourceServer.buildPaymentRequirements({
            scheme: 'exact',
            network: 'nano:mainnet',
            price: '0.01',
            payTo,
            description: 'Deterministic JSON structural analysis',
            mimeType: 'application/json',
            extra: { requestDigest: 'a'.repeat(64) },
          });

          const requirement = requirements[0];
          if (!requirement || requirement.scheme !== 'exact' || requirement.network !== 'nano:mainnet') {
            throw new Error('Expected exact Nano mainnet requirements were not built.');
          }
          if (requirement.asset !== 'XNO' || requirement.amount !== '10000000000000000000000000000') {
            throw new Error('Unexpected Nano asset or amount.');
          }
          if (requirement.payTo !== payTo) {
            throw new Error('Unexpected payment destination.');
          }

          console.log(JSON.stringify({
            ready: true,
            scheme: requirement.scheme,
            network: requirement.network,
            asset: requirement.asset,
            amount: requirement.amount,
            payToMatches: true,
          }));
          NODE
