name: Task 5 CI

on:
  push:
    branches:
      - task5-production-nano-payment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx --yes wrangler@4.137.0 deploy --dry-run
      - run: npm ls --all
      - run: npm audit --omit=dev --audit-level=moderate
