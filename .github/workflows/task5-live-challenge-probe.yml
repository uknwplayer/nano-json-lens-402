name: Task 5 Live Production Challenge Probe

on:
  push:
    branches:
      - task5-production-nano-payment
    paths:
      - .github/workflows/task5-live-challenge-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Generate real initialized production 402 challenge without payment
        run: |
          node --input-type=module - <<'NODE'
          import { createHash } from 'node:crypto';
          import { createProductionNanoPaymentBootstrap } from './src/payment/production-resource-server.ts';
          import { createNanoPaymentGate } from './src/payment.ts';
          import { createHandler } from './src/server.ts';

          const facilitatorUrl = 'https://facilitator.pursekeeper.dev';
          const payTo = 'nano_1zwik4hd1pjy73owfah8xuxzokk6zexc5a6rs6byhrxryggkbh38kemm51yt';
          const resourceUrl = 'https://seller.example/api/lens';
          const body = JSON.stringify({ document: { probe: true } });
          const requestDigest = createHash('sha256').update(Buffer.from(body, 'utf8')).digest('hex');

          const bootstrap = createProductionNanoPaymentBootstrap({ facilitatorUrl });
          const resourceServer = await bootstrap.initialize();
          if (!bootstrap.isReady()) throw new Error('Production bootstrap did not become ready.');

          // Challenge-only inspection. No payment header is supplied, so replay-state,
          // verifyPayment, and settlePayment are unreachable in this probe.
          const paymentGate = createNanoPaymentGate({
            facilitatorUrl,
            payTo,
            priceXno: '0.01',
            resourceServer,
          });
          const handler = createHandler({ resourceUrl, paymentGate });
          const response = await handler(new Request(resourceUrl, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body,
          }));

          if (response.status !== 402) throw new Error(`Expected HTTP 402, received ${response.status}.`);
          const paymentRequiredHeader = response.headers.get('payment-required');
          if (!paymentRequiredHeader) throw new Error('Missing payment-required header.');

          const payload = await response.json();
          if (payload?.error?.code !== 'PAYMENT_REQUIRED') throw new Error('Missing PAYMENT_REQUIRED body error.');
          const challenge = payload?.paymentRequirements;
          if (!challenge || challenge.x402Version !== 2 || !Array.isArray(challenge.accepts)) {
            throw new Error('Unexpected x402 challenge envelope.');
          }
          if (challenge.accepts.length !== 1) throw new Error('Expected exactly one accepted payment method.');
          const accepted = challenge.accepts[0];
          if (accepted.scheme !== 'exact' || accepted.network !== 'nano:mainnet') {
            throw new Error('Unexpected scheme/network in production challenge.');
          }
          if (accepted.asset !== 'XNO' || accepted.amount !== '10000000000000000000000000000') {
            throw new Error('Unexpected asset/amount in production challenge.');
          }
          if (accepted.payTo !== payTo) throw new Error('Unexpected payTo in production challenge.');
          if (accepted.extra?.requestDigest !== requestDigest) throw new Error('Request digest metadata mismatch.');

          const decodedHeader = JSON.parse(Buffer.from(paymentRequiredHeader, 'base64').toString('utf8'));
          if (JSON.stringify(decodedHeader) !== JSON.stringify(challenge)) {
            throw new Error('payment-required header does not match body challenge.');
          }

          console.log(JSON.stringify({
            status: response.status,
            x402Version: challenge.x402Version,
            scheme: accepted.scheme,
            network: accepted.network,
            asset: accepted.asset,
            amount: accepted.amount,
            payToMatches: accepted.payTo === payTo,
            requestDigestMatches: accepted.extra?.requestDigest === requestDigest,
            paymentHeaderMatchesBody: true,
            paymentSubmitted: false,
          }));
          NODE
